services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plataforma_fiscal}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-plataforma_fiscal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migration:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./API/app/.env.example
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/plataforma_fiscal}
      POSTGRES_DSN: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/plataforma_fiscal}
    command: ["alembic", "-c", "API/app/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  reference-seed:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./API/app/.env.example
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/plataforma_fiscal}
      POSTGRES_DSN: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/plataforma_fiscal}
    command: ["python", "API/scripts/bootstrap_referencias.py"]
    depends_on:
      migration:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./API/app/.env.example
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/plataforma_fiscal}
      POSTGRES_DSN: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/plataforma_fiscal}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ENABLE_STARTUP_SCHEMA_ENSURE: "false"
    ports:
      - "8000:8000"
    depends_on:
      reference-seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celery-worker-default:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./API/app/.env.example
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/plataforma_fiscal}
      POSTGRES_DSN: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/plataforma_fiscal}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "-Q", "default"]
    depends_on:
      reference-seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celery-worker-nfe:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./API/app/.env.example
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/plataforma_fiscal}
      POSTGRES_DSN: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/plataforma_fiscal}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "-Q", "nfe"]
    depends_on:
      reference-seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celery-worker-sped:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./API/app/.env.example
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/plataforma_fiscal}
      POSTGRES_DSN: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/plataforma_fiscal}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "-Q", "sped"]
    depends_on:
      reference-seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celery-worker-conta-azul:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./API/app/.env.example
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/plataforma_fiscal}
      POSTGRES_DSN: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/plataforma_fiscal}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CONTAAZUL_CLIENT_ID: ${CONTAAZUL_CLIENT_ID:-}
      CONTAAZUL_CLIENT_SECRET: ${CONTAAZUL_CLIENT_SECRET:-}
      CONTAAZUL_REDIRECT_URI: ${CONTAAZUL_REDIRECT_URI:-}
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "-Q", "conta_azul"]
    depends_on:
      reference-seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./API/app/.env.example
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/plataforma_fiscal}
      POSTGRES_DSN: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/plataforma_fiscal}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info"]
    depends_on:
      reference-seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./Painel:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - api

volumes:
  postgres_data:
  frontend_node_modules:
